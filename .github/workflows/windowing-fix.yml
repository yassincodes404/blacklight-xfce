name: Build native icon resolver
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolver:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-icons'
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: apt-get update && apt-get install -y build-essential python3 curl pkg-config libtool gettext libgtk-3-dev libwnck-3-dev libdisplay-info-dev libxrandr-dev libwayland-dev wayland-protocols xfce4-dev-tools
      - name: Build and test ABI-matched package
        run: python3 tools/build_windowing.py --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: galinia-native-icon-resolver
          path: dist/*
          if-no-files-found: error
          retention-days: 14
